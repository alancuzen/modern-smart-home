# Repo:   mosquitto/mosquitto.conf
# Deploy: /etc/mosquitto/mosquitto.conf on the Mosquitto LXC, 10.0.20.15
#         (Debian package, Mosquitto 2.x - Chapter 5)

# Written for Mosquitto 2.0.x as packaged by Debian 12/13.
# Security - applies to every listener
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile
# Mosquitto 2.1+ still accepts password_file, acl_file and persistence
# but deprecates them (removal in 3.0). On 2.1, replace the two lines
# above with the equivalent plugins; adjust the .so paths to where your
# package installs them (see mosquitto.org/documentation/plugins):
#   global_plugin /usr/lib/mosquitto_password_file.so
#   plugin_opt_password_file /etc/mosquitto/passwd
#   global_plugin /usr/lib/mosquitto_acl_file.so
#   plugin_opt_acl_file /etc/mosquitto/aclfile

# Single TLS listener. Every client - Home Assistant, Frigate,
# Zigbee2MQTT and any MQTT-based ESP32 node - connects on 8883.
# There is deliberately no plain-text 1883 listener.
listener 8883 10.0.20.15
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
cafile /etc/mosquitto/certs/ca.crt
tls_version tlsv1.2
require_certificate false

# Persistence and logging
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 1800
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Queue limits
max_queued_messages 1000
max_inflight_messages 20
