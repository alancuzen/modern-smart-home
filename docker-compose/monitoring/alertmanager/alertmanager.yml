# Repo:   docker-compose/monitoring/alertmanager/alertmanager.yml
route:
  group_by: ["alertname", "name"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: home_assistant_webhook

receivers:
  - name: home_assistant_webhook
    webhook_configs:
      # Replace with a long random ID (openssl rand -hex 24), as in automations.yaml
      - url: "http://10.0.10.50:8123/api/webhook/REPLACE_WITH_RANDOM_WEBHOOK_ID"
        send_resolved: true
