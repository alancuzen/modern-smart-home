# Repo:   docker-compose/monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter uses host networking: scrape the VM's own address
  - job_name: "docker_vm"
    static_configs:
      - targets: ["10.0.10.55:9100"]

  - job_name: "proxmox_host"
    static_configs:
      - targets: ["10.0.10.2:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "home_assistant"
    scrape_interval: 30s
    metrics_path: /api/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ha_token
    static_configs:
      - targets: ["10.0.10.50:8123"]
