# Repo:   network/avahi-daemon.conf
# Deploy: /etc/avahi/avahi-daemon.conf on a Linux router (Chapter 3).
#         On pfSense, set the same options in Services > Avahi.
[server]
use-ipv4=yes
# IPv6 must stay enabled: Matter discovery uses IPv6 mDNS.
use-ipv6=yes
# Reflect ONLY between Trusted (VLAN 10) and IoT (VLAN 20).
# Interface names are examples - use your router's VLAN interfaces.
allow-interfaces=vlan10,vlan20
enable-dbus=no

[reflector]
enable-reflector=yes

[rlimits]
rlimit-nproc=3
