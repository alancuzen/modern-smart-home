# Repo:   esphome/heating_zone_controller.yaml
# Deploy: /config/esphome/heating_zone_controller.yaml (Chapter 10)
# Two-zone PID controller for an S-plan system. Each relay replaces one
# zone's room-thermostat contacts; the zone valves' end-switches still
# fire the boiler, and the boiler's own frost and overheat protection
# stay hardwired. Mains-side wiring is notifiable work (Chapter 8).
esphome:
  name: heating-zone-controller
  friendly_name: "Heating Zone Controller"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_key_heating

ota:
  - platform: esphome
    encryption:   # ESPHome 2026.9+: OTA encrypted with the api: key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.20.135
    gateway: 10.0.20.1
    subnet: 255.255.255.0
    dns1: 10.0.20.1

logger:

sensor:
  # Room temperatures from the environmental nodes, via Home Assistant.
  # No update for 10 min (or "unavailable") gives NaN; the PID controller
  # then drives its output to 0 and the zone valve closes.
  - platform: homeassistant
    id: downstairs_temp
    entity_id: sensor.kitchen_environmental_node_temperature
    filters:
      - timeout: 10min
  - platform: homeassistant
    id: upstairs_temp
    entity_id: sensor.landing_environmental_node_temperature
    filters:
      - timeout: 10min

  # Controller output (0-100 %) for dashboards and the Energy tab
  - platform: pid
    climate_id: zone_downstairs
    type: HEAT
    name: "Downstairs Heat Demand"
  - platform: pid
    climate_id: zone_upstairs
    type: HEAT
    name: "Upstairs Heat Demand"

output:
  # Time-proportioning over a 15-minute cycle. min_power 0.10 means any
  # non-zero demand opens the valve for at least 90 s (10 % of 15 min),
  # so the valve motor is never short-cycled; zero stays fully closed.
  - platform: slow_pwm
    id: zone_downstairs_valve
    pin:
      number: GPIO25
      inverted: false   # true for active-low relay modules
    period: 15min
    min_power: 0.10
    zero_means_zero: true
  - platform: slow_pwm
    id: zone_upstairs_valve
    pin:
      number: GPIO26
      inverted: false
    period: 15min
    min_power: 0.10
    zero_means_zero: true

climate:
  - platform: pid
    id: zone_downstairs
    name: "Downstairs"
    sensor: downstairs_temp
    default_target_temperature: 16°C
    heat_output: zone_downstairs_valve
    visual:
      min_temperature: 7
      max_temperature: 24
      temperature_step: 0.5
    # Conservative starting values for radiators: replace them with the
    # autotune results (Chapter 10).
    control_parameters:
      kp: 0.5
      ki: 0.0002
      kd: 0.0
      output_averaging_samples: 5
      derivative_averaging_samples: 5
    deadband_parameters:
      threshold_high: 0.3°C
      threshold_low: -0.3°C
      kp_multiplier: 0.0
      ki_multiplier: 0.05
      kd_multiplier: 0.0
  - platform: pid
    id: zone_upstairs
    name: "Upstairs"
    sensor: upstairs_temp
    default_target_temperature: 16°C
    heat_output: zone_upstairs_valve
    visual:
      min_temperature: 7
      max_temperature: 24
      temperature_step: 0.5
    control_parameters:
      kp: 0.5
      ki: 0.0002
      kd: 0.0
      output_averaging_samples: 5
      derivative_averaging_samples: 5
    deadband_parameters:
      threshold_high: 0.3°C
      threshold_low: -0.3°C
      kp_multiplier: 0.0
      ki_multiplier: 0.05
      kd_multiplier: 0.0

button:
  - platform: template
    name: "Downstairs PID Autotune"
    entity_category: config
    on_press:
      - climate.pid.autotune: zone_downstairs
  - platform: template
    name: "Upstairs PID Autotune"
    entity_category: config
    on_press:
      - climate.pid.autotune: zone_upstairs
