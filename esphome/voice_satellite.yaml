# Repo:   esphome/voice_satellite.yaml
# Deploy: /config/esphome/voice_satellite.yaml (Chapter 15)
# Hardware: ESP32-S3-DevKitC-1 (N16R8), INMP441 I2S microphone,
# MAX98357A I2S amplifier. Validate with: esphome config voice_satellite.yaml
esphome:
  name: hallway-voice-satellite
  friendly_name: "Hallway Voice Satellite"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_key_voice_satellite
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

ota:
  - platform: esphome
    encryption:   # ESPHome 2026.9+: OTA encrypted with the api: key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.20.130
    gateway: 10.0.20.1
    subnet: 255.255.255.0
    dns1: 10.0.20.1

logger:

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_out
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO7

microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO8
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO9
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 16000

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO48          # GPIO38 on DevKitC-1 v1.1 boards
    num_leds: 1
    channel_colors: GRB  # ESPHome 2026.8+ (replaces rgb_order)
    chipset: WS2812
    effects:
      - pulse:
          name: "pulse"

# On-device wake word; audio then streams to Home Assistant over the
# encrypted native API, which runs the Whisper -> Ollama -> Piper pipeline.
micro_wake_word:
  microphone: board_microphone
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - light.turn_on:
        id: status_led
        red: 0%
        green: 0%
        blue: 100%
        effect: "pulse"

voice_assistant:
  id: va_pipeline
  microphone: board_microphone
  speaker: board_speaker
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_end:
    - light.turn_off: status_led
    - micro_wake_word.start:
